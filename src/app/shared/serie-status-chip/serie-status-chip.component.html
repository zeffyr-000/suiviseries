@if (variant() === 'inline') {
    <span class="status-inline" [class]="statusClass()">{{ translatedStatus() }}</span>
} @else {
    <mat-chip-set>
        <mat-chip [class]="statusClass()" selected>
            @if (showIcon()) {
                <mat-icon class="status-icon">{{ statusIcon() }}</mat-icon>
            }
            {{ translatedStatus() }}
        </mat-chip>
    </mat-chip-set>
}
