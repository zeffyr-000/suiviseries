<div
    class="stat-ring"
    [class.stat-ring--ice]="accent() === 'ice'"
    [class.stat-ring--flare]="accent() === 'flare'"
>
    <svg class="stat-ring-svg" viewBox="0 0 46 46" aria-hidden="true">
        <circle class="stat-ring-track" cx="23" cy="23" [attr.r]="radius" />
        <circle
            class="stat-ring-value"
            cx="23"
            cy="23"
            [attr.r]="radius"
            [attr.stroke-dasharray]="circumference"
            [attr.stroke-dashoffset]="offset()"
        />
    </svg>

    <span class="stat-ring-label">{{ label() }}</span>

    @if (description()) {
        <span class="visually-hidden">{{ description() }}</span>
    }
</div>
