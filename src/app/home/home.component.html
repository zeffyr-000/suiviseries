<app-home-hero [spotlight]="spotlightSerie()" />

<!-- No scroll reveal on this band: it is on screen at load, and a reveal keyed
     to scroll position left it part-faded until the visitor scrolled. -->
<section class="home-section">
    <app-section-header
        titleKey="sections.popular_right_now"
        eyebrowKey="sections.popular_eyebrow"
    />

    @if (!listsReady()) {
        <!-- Same grid as the loaded band, so nothing jumps when it lands. -->
        <div class="trending-bento" aria-hidden="true">
            <div class="skeleton skeleton-feature"></div>
            <div class="skeleton-rail">
                @for (item of skeletonSlots; track item) {
                    <div class="skeleton skeleton-poster"></div>
                }
            </div>
        </div>
    } @else {
        <div class="trending-bento" [class.trending-bento--rail-only]="!trendingSerie()">
            @if (trendingSerie(); as trending) {
                <app-featured-serie [serie]="trending" />
            }

            <!-- The leading posters sit beside the featured card, above the
                 fold, so they are fetched eagerly rather than lazily. Four
                 covers the widest common desktop. -->
            <app-serie-rail [series]="railSeries()" labelKey="sections.rail_label" [eagerCount]="4">
                <!-- The next page continues the rail, so the button closes it
                     as a poster-sized tile rather than sitting under it. -->
                @if (hasMore()) {
                    <button
                        type="button"
                        class="rail-more load-more"
                        [appButtonLoading]="loadingMore()"
                        (click)="loadMoreSeries()"
                    >
                        <mat-icon>add</mat-icon>
                        <span class="label-large">{{ 'sections.load_more' | transloco }}</span>
                    </button>
                }
            </app-serie-rail>
        </div>
    }
</section>

<section class="home-section reveal-on-scroll" id="decouvrir">
    <app-section-header
        titleKey="value_props.title"
        eyebrowKey="value_props.eyebrow"
        accent="flare"
    />
    <app-home-value-props />
</section>

<section class="home-section reveal-on-scroll">
    <app-section-header
        titleKey="sections.top_rated"
        eyebrowKey="sections.top_rated_eyebrow"
        leadKey="sections.top_rated_lead"
        accent="ice"
    />

    @if (topRatedLoading()) {
        <div class="skeleton-grid" aria-hidden="true">
            @for (item of rankingSkeletonSlots; track item) {
                <div class="skeleton skeleton-poster"></div>
            }
        </div>
    } @else {
        <app-ranked-series [series]="topRatedSeries()" />

        @if (topRatedHasMore()) {
            <div class="load-more-row">
                <button
                    mat-stroked-button
                    class="load-more"
                    [appButtonLoading]="topRatedLoadingMore()"
                    (click)="loadMoreTopRated()"
                >
                    <mat-icon>expand_more</mat-icon>
                    {{ 'sections.load_more' | transloco }}
                </button>
            </div>
        }
    }
</section>
