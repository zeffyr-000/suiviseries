@if (shouldShowPrompt()) {
    <aside class="push-prompt" [attr.aria-label]="'push_notifications.prompt_title' | transloco">
        <div class="push-prompt-content">
            <mat-icon>notifications_active</mat-icon>
            <div class="push-prompt-text">
                <h2 class="push-prompt-title">
                    {{ 'push_notifications.prompt_title' | transloco }}
                </h2>
                <p>{{ 'push_notifications.prompt_message' | transloco }}</p>
            </div>
            <div class="push-prompt-actions">
                <button mat-button (click)="dismiss()">
                    {{ 'push_notifications.not_now' | transloco }}
                </button>
                <button mat-flat-button (click)="enableNotifications()" [disabled]="isLoading()">
                    @if (isLoading()) {
                        <mat-icon class="spinner">sync</mat-icon>
                    }
                    {{ 'push_notifications.enable' | transloco }}
                </button>
            </div>
        </div>
    </aside>
}
