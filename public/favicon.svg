<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Suivi Séries">
  <defs>
    <!-- Gold holds the first third: it is the brand anchor, and with the stop
         at 0 it survived only in the corner pixel. -->
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d888"/>
      <stop offset="0.32" stop-color="#e4c368"/>
      <stop offset="0.66" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- Rounded aurora background -->
  <rect width="512" height="512" rx="112" fill="url(#aurora)"/>
  <!-- Antennas -->
  <g fill="none" stroke="#0b0e1e" stroke-width="26" stroke-linecap="round">
    <line x1="256" y1="120" x2="196" y2="64"/>
    <line x1="256" y1="120" x2="316" y2="64"/>
  </g>
  <!-- TV / screen body -->
  <rect x="96" y="150" width="320" height="236" rx="34"
        fill="none" stroke="#0b0e1e" stroke-width="30"/>
  <!-- Play triangle -->
  <path d="M226 214 L226 322 L312 268 Z" fill="#0b0e1e"/>
</svg>
